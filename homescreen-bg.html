<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>citeChris — Homescreen</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="homescreen-bg.css">
</head>
<body>

<!-- grid bg -->
<div class="grid-bg"></div>

<!-- floating code snippets -->
<div class="floaters" id="floaters"></div>

<!-- corners -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- side ticks -->
<div class="side-left">
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
</div>
<div class="side-right">
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
  <div class="side-tick"></div>
</div>

<!-- top status bar -->
<div class="status-bar">
  <div><span class="status-dot"></span>SYSTEM ONLINE</div>
  <div>citeChris.dev — SESSION ACTIVE</div>
  <div>#100DaysOfCode</div>
</div>

<!-- center content -->
<div class="center">
  <div class="prompt-line"><span>~/citeChris $</span> ./init.sh</div>

  <div class="greeting">
    Hello<span class="comma">,</span> <span class="accent">World</span><span class="blink-cursor"></span>
  </div>

  <div class="tagline">
    Building in public · JavaScript · <span class="highlight">SecureVault</span> · Ibadan, NG
  </div>

  <div class="handle">
    <div class="handle-icon"></div>
    <div class="handle-text">@citeChris · Junior Developer · Day 1 of ∞</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>LOADING SKILLS</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="pfill"></div>
    </div>
  </div>
</div>

<!-- bottom bar -->
<div class="bottom-bar">
  <div>ASPIRING SOFTWARE ENGINEER</div>
  <div>UI · JS · PYTHON · SECURITY</div>
  <div>EST. 2025</div>
</div>

<!-- cursor -->
<div class="cursor" id="cursor"></div>
<!-- cursor toggle for accessibility -->
<button id="cursor-toggle" style="position:fixed;top:12px;right:12px;z-index:10000;font-size:11px;padding:4px 10px;background:rgba(0,255,135,0.13);color:#00ff87;border:1px solid #00ff87;border-radius:3px;cursor:pointer;">Disable Custom Cursor</button>

<script defer>
  // cursor toggle logic
  const cursorToggle = document.getElementById('cursor-toggle');
  const body = document.body;
  let customCursorEnabled = true;

  function setCursorState(enabled) {
    customCursorEnabled = enabled;
    if (enabled) {
      body.classList.add('hide-cursor');
      document.getElementById('cursor').style.display = '';
      cursorToggle.textContent = 'Disable Custom Cursor';
    } else {
      body.classList.remove('hide-cursor');
      document.getElementById('cursor').style.display = 'none';
      cursorToggle.textContent = 'Enable Custom Cursor';
    }
  }

  // Initialize with custom cursor enabled
  setCursorState(true);

  cursorToggle.addEventListener('click', () => {
    setCursorState(!customCursorEnabled);
  });

  // cursor
  const cur = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    if (!customCursorEnabled) return;
    cur.style.left = e.clientX + 'px';
    cur.style.top  = e.clientY + 'px';
  });

  // progress percentage counter
  const pct = document.getElementById('pct');
  const pfill = document.getElementById('pfill');
  let val = 0;
  const targets = [
    {t:72,  delay:2200},
    {t:85,  delay:4000},
    {t:100, delay:5200}
  ];

  targets.forEach(({t, delay}) => {
    setTimeout(() => {
      const interval = setInterval(() => {
        if (val >= t) { clearInterval(interval); return; }
        val++;
        pct.textContent = val + '%';
      }, 18);
    }, delay);
  });

  // floating code snippets
  const lines = [
    'const secure = true;',
    'if (password.length >= 12)',
    'fetch("/api/check-pwned")',
    'let streak = 100;',
    'npm run build',
    'git push origin main',
    'import { encrypt } from "./lib"',
    'function validateForm(input)',
    '> #100DaysOfCode Day 87',
    'const hash = sha256(pw)',
    'addEventListener("submit")',
    'return res.json({ safe: true })',
    'pip install flask',
    'SELECT * FROM users',
    'document.querySelector(".hero")',
    '// TODO: ship SecureVault',
    'response.status(200).send()',
    'const entropy = calcStrength(pw)',
    'export default function App()',
    'git commit -m "feat: day 50"',
  ];

  const container = document.getElementById('floaters');

  const MAX_SNIPPETS = 40; // Limit the number of floating snippets

  function spawnSnippet() {
    const el = document.createElement('div');
    el.className = 'snippet';
    el.textContent = lines[Math.floor(Math.random() * lines.length)];
    el.style.left = Math.random() * 96 + '%';
    const dur = 14 + Math.random() * 18;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * -dur) + 's';
    el.style.fontSize = (9 + Math.random() * 4) + 'px';
    container.appendChild(el);

    // Remove oldest snippet if exceeding max allowed
    if (container.childNodes.length > MAX_SNIPPETS) {
      container.removeChild(container.firstChild);
    }

    setTimeout(() => el.remove(), (dur + 2) * 1000);
  }

  for (let i = 0; i < 28; i++) spawnSnippet();
  setInterval(spawnSnippet, 1800);
</script>
</body>
</html>
